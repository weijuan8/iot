server:
  port: 48080

--- #################### 数据库相关配置 ####################
spring:
  # 数据源配置项
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
      - de.codecentric.boot.admin.server.config.AdminServerAutoConfiguration
      - de.codecentric.boot.admin.server.ui.config.AdminServerUiAutoConfiguration
      - de.codecentric.boot.admin.client.config.SpringBootAdminClientAutoConfiguration
  datasource:
    druid:
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: true
        allow:
        url-pattern: /druid/*
        login-username:
        login-password:
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 100
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
    dynamic:
      druid:
        initial-size: 1
        min-idle: 1
        max-active: 20
        max-wait: 600000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 300000
        max-evictable-idle-time-millis: 900000
        validation-query: SELECT 1 FROM DUAL
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
      primary: master
      datasource:
        master:
          url: jdbc:mysql://localhost:3306/enjoyiot?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
          username: root
          password: 123456
        slave:
          lazy: true
          url: jdbc:mysql://localhost:3306/enjoyiot?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&nullCatalogMeansCurrent=true
          username: root
          password: 123456

  # Redis 配置
  data:
    redis:
      port: 6379
      database: 8
      host: localhost

--- #################### 定时任务相关配置 ####################

spring:
  quartz:
    auto-startup: true
    scheduler-name: schedulerName
    job-store-type: jdbc
    wait-for-jobs-to-complete-on-shutdown: true
    properties:
      org:
        quartz:
          scheduler:
            instanceName: schedulerName
            instanceId: AUTO
          jobStore:
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
            isClustered: true
            clusterCheckinInterval: 15000
            misfireThreshold: 60000
          threadPool:
            threadCount: 25
            threadPriority: 5
            class: org.quartz.simpl.SimpleThreadPool
    jdbc:
      initialize-schema: NEVER

  # TDengine 时序数据库配置
  td-datasource:
    url: jdbc:TAOS-RS://localhost:6041/eiot?timezone=UTC-8&charset=UTF-8&locale=en_US.UTF-8
    db: eiot
    username: root
    password: taosdata
    driverClassName: com.taosdata.jdbc.rs.RestfulDriver

  # IoTDB 时序数据库配置（可选，暂未使用）
  iotdb-datasource:
    url: iotdb-server-ip:6667
    username:
    password:
    baseDb: root.eiot

  # PostgreSQL 时序数据库配置（可选，暂未使用）
  postgres:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/enjoyiot?useUnicode=true&characterEncoding=utf8&useSSL=true&autoReconnect=true&reWriteBatchedInserts=true
    username: postgres
    password: postgres

  # KaiwuDB 配置（可选，暂未使用）
  kw-datasource:
    driverClassName: com.kaiwudb.Driver
    url: jdbc:kaiwudb://127.0.0.1:26257/ts_enjoyiot
    username: root
    password:

  # Elasticsearch 配置（可选，暂未使用）
  elasticsearch:
    rest:
      uris: http://localhost:9200
      username:
      password:
      connection-timeout: 10s

easy-es:
  enable: true
  address: 127.0.0.1:9200

--- #################### 消息队列相关 ####################

rocketmq:
  name-server: localhost:9876

spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: rabbit
    password: rabbit
  kafka:
    bootstrap-servers: localhost:9092

--- #################### 服务保障相关配置 ####################

lock4j:
  acquire-timeout: 3000
  expire: 30000

--- #################### 监控相关配置 ####################

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: '*'

spring:
  boot:
    admin:
      client:
        url: http://localhost:${server.port}/${spring.boot.admin.context-path}
        instance:
          service-host-type: IP
      context-path: /admin

# 日志输出目录与滚动/保留策略统一由 logback-spring.xml 管理
# 默认目录：jar 包所在目录下的 log（可用 -Dlog.home=/xxx/log 覆盖）
logging:
  level:
    com.enjoyiot.module.bpm.dal.mysql: debug
    com.enjoyiot.module.infra.dal.mysql: debug
    com.enjoyiot.module.infra.dal.mysql.logger.ApiErrorLogMapper: INFO
    com.enjoyiot.module.infra.dal.mysql.job.JobLogMapper: INFO
    com.enjoyiot.module.infra.dal.mysql.file.FileConfigMapper: INFO
    com.enjoyiot.module.system.dal.mysql: debug
    com.enjoyiot.module.system.dal.mysql.sms.SmsChannelMapper: INFO
    com.enjoyiot.module.eiot.dal.mysql: debug
    com.enjoyiot.module.ai.dal.mysql: debug
    org.springframework.context.support.PostProcessorRegistrationDelegate: ERROR

debug: false

